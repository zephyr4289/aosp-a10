  # --------------------------------------------------------------------------
  #  POSTCHECK — the single source of truth for what happens next.
  #  Reads INDEX.json (via `forge probe`) and emits `phase`:
  #    verify  -> done=true: run the 14-point gate + publish (this run)
  #    slice   -> more work: conveyor re-dispatches (or weekly cron resumes)
  #    fail    -> capacity/error/budget-exhausted: RED, human triage
  #  This is THE fix for the premature-verification bug: the DAG never
  #  guesses from job results — it reads the coordination record.
  # --------------------------------------------------------------------------
  postcheck:
    name: "Postcheck (INDEX -> phase)"
    needs: [plan, slot-1, slot-2, slot-3, slot-4, slot-5, slot-6, slot-7, slot-8, slot-9, slot-10]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
      phase_reason: ${{ steps.phase.outputs.phase_reason }}
      slice: ${{ steps.phase.outputs.slice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Probe INDEX -> conveyor decision"
        id: phase
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          python3 -m forge_core.cli --root . probe \
            --rom "${{ github.event.inputs.rom || 'qassa-a10' }}" | tee probe.txt
          PHASE=$(sed -n 's/^OUT: phase=//p' probe.txt | tail -1)
          REASON=$(sed -n 's/^OUT: phase_reason=//p' probe.txt | tail -1)
          SLICE=$(sed -n 's/^OUT: slice=//p' probe.txt | tail -1)
          {
            echo "phase=$PHASE"
            echo "phase_reason=$REASON"
            echo "slice=$SLICE"
          } >> "$GITHUB_OUTPUT"
          echo "### Conveyor decision: \`$PHASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${REASON}" >> "$GITHUB_STEP_SUMMARY"
      - name: "GC silicon locks + stale states (best effort)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 -m forge_core.cli --root . gc \
            --rom "${{ github.event.inputs.rom || 'qassa-a10' }}" --locks || true
      - name: "Halt on phase=fail (honest red — never loop the deadlock)"
        if: steps.phase.outputs.phase == 'fail'
        run: |
          echo "::error::Conveyor halted: ${{ steps.phase.outputs.phase_reason }}"
          exit 1

  # --------------------------------------------------------------------------
  #  VERIFY — runs ONLY when INDEX done=true (a real ROM zip was banked).
  # --------------------------------------------------------------------------
  verify:
    name: "14-point hard gate"
    needs: [plan, postcheck]
    if: "!cancelled() && needs.postcheck.outputs.phase == 'verify'"
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: "Prepare storage volume"
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "${{ github.event.inputs.rom || 'qassa-a10' }}"
      - name: "Verify (gate)"
        id: gate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 -m forge_core.cli --root . verify \
            --rom "${{ github.event.inputs.rom || 'qassa-a10' }}" \
            --out SAFETY_REPORT.json
      - name: "Upload SAFETY_REPORT (even on FAIL)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: SAFETY_REPORT.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: "Publish (gate-gated)"
    needs: [plan, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ${{ needs.plan.outputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Prepare storage volume"
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "${{ github.event.inputs.rom || 'qassa-a10' }}"
      - name: "Download gate report"
        uses: actions/download-artifact@v4
        with: { name: safety-report, path: . }
      - name: "Publish ROM + guarded flash script"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 -m forge_core.cli --root . publish \
            --rom "${{ github.event.inputs.rom || 'qassa-a10' }}" \
            --report SAFETY_REPORT.json

  # --------------------------------------------------------------------------
  #  CONVEYOR — continuous-progress loop. When the run's slices are all
  #  banked but the ROM is not done, re-dispatch this workflow (the new
  #  run resumes at slice N+1 with exact ninja resume; slots early-exit
  #  once done). GITHUB_TOKEN may NOT trigger workflow_dispatch (GitHub
  #  blocks token-generated events) — so this needs the optional
  #  FORGE_DISPATCH_TOKEN repo secret (PAT, workflow scope). Without it
  #  the run ends green and the weekly cron catch-up resumes the
  #  campaign — never a silent stall, never an infinite loop.
  # --------------------------------------------------------------------------
  conveyor:
    name: "Conveyor (re-dispatch if more slices needed)"
    needs: [plan, postcheck]
    if: "!cancelled() && needs.postcheck.outputs.phase == 'slice'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Re-dispatch forge.yml (resume at next slice)"
        env:
          GH_TOKEN: ${{ secrets.FORGE_DISPATCH_TOKEN || github.token }}
          ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
          TARGET: ${{ github.event.inputs.target || '' }}
          SKIP_TURBO: ${{ github.event.inputs.skip_turbo || 'false' }}
          CANDIDATES: ${{ github.event.inputs.candidates || '20' }}
          STRICT_MINING: ${{ github.event.inputs.strict_mining || 'true' }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          ARGS=(--ref "$REF" -f "rom=$ROM")
          [ -n "$TARGET" ] && ARGS+=(-f "target=$TARGET")
          ARGS+=(-f "skip_turbo=$SKIP_TURBO" -f "candidates=$CANDIDATES" -f "strict_mining=$STRICT_MINING")
          if gh workflow run forge.yml "${ARGS[@]}"; then
            echo "::notice::conveyor: re-dispatched forge.yml (rom=$ROM) — the campaign continues"
          else
            echo "::notice::conveyor: no dispatch token available (GITHUB_TOKEN cannot trigger workflows). The weekly cron catch-up (Mon 03:17 UTC) resumes the campaign. Add the FORGE_DISPATCH_TOKEN secret to enable continuous mode."
          fi
