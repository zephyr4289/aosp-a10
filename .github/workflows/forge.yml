name: "ROMForge — universal build"

# =============================================================================
#  The orchestrator. One workflow run carries a chain of build slots:
#
#    plan ──► sync (only if src-<mhash> missing)
#              ├─► turbo:bootimage ──┐   (partition prewarm, parallel)
#              ├─► turbo:vendorimage ├──► ... running while slot-1 builds ...
#              └─► turbo:productimage ┘            │
#        slot-1 ──► slot-2 ──► … ──► slot-6 ──► postcheck ──┬─► verify ──► publish
#                    (each slot = a MINING MATRIX: 8 runner    │
#                     candidates probe their CPU; the best      ├─► conveyor
#                     one claims an atomic lock and builds,     │
#                     the rest fast-discard in <1 min)          └─► (red on phase=fail)
#
#  THE FOUR STRUCTURAL FIXES (vs the runs #16-#36 forensics):
#
#  1. STORAGE V2 — every job calls `forge prepare`, which mounts a
#     btrfs-zstd:1 compressed volume on /mnt (hard-capped sparse image).
#     The ~75 GiB logical working set compresses to ~35-45 GiB physical,
#     so restore+build actually FITS. Degraded hosts fall back to plain
#     dirs honestly (and the engine then classifies capacity, see #2).
#
#  2. CAPACITY ≠ SLICED — the engine now emits stop_reason (budget|disk|
#     root-disk). 'disk' classifies the slice as CAPACITY, and the DAG
#     (forge_core.dag) REFUSES to re-dispatch: the old infinite
#     restore→30 s build→delete source→re-download loop is dead.
#
#  3. DONE-GATED VERIFICATION — verify/publish run ONLY when the postcheck
#     probe reads INDEX done=true (a valid ROM zip was banked). The
#     premature "no ROM zip to verify" red-herring gate runs are dead.
#
#  4. SILICON MINING — 8-candidate matrices self-select by CPU score
#     (Zen5 Turin / Granite Rapids first, fallback after 240 s so a slot
#     NEVER stalls on the silicon lottery). Atomic claim via `gh release
#     create` (server-side serialized). Zero cost on public repos.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      rom:
        description: "ROM profile (configs/roms/<name>.yaml)"
        required: true
        default: "qassa-a10"
      target:
        description: "build target override (bacon/qassa/bootimage/...)"
        required: false
        default: ""
      force_sync:
        description: "Re-resolve + re-snapshot source (new mhash)"
        type: boolean
        required: false
        default: false
      skip_turbo:
        description: "Disable partition fan-out for this run"
        type: boolean
        required: false
        default: false
      candidates:
        description: "Silicon-mining candidates per slot (0 or 1 = off)"
        required: false
        default: "20"
      strict_mining:
        description: "Strict mining: abort slot if no Zen5 score 100 CPU is found (reject slow fallback)"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "17 3 * * 1"   # weekly catch-up (resume if a run was cut short)
    - cron: "17 3 * * *"   # daily progress pulse

concurrency:
  group: forge-${{ github.event.inputs.rom || 'qassa-a10' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORGE_STRICT_MINING: ${{ github.event.inputs.strict_mining != '' && github.event.inputs.strict_mining || 'true' }}

jobs:
  # --------------------------------------------------------------------------
  plan:
    name: "Plan + validate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      runner: ${{ steps.contract.outputs.runner }}
      key: ${{ steps.contract.outputs.target_key }}
      turbo: ${{ steps.contract.outputs.turbo }}
      src_needed: ${{ steps.probe.outputs.src_needed }}
      target: ${{ steps.contract.outputs.target }}
      mining: ${{ steps.contract.outputs.mining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Validate profiles + compute execution contract"
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          SKIP_TURBO: ${{ github.event.inputs.skip_turbo }}
          ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
          CANDIDATES: ${{ github.event.inputs.candidates || '20' }}
        run: |
          set -euo pipefail
          python3 -m forge_core.cli --root . validate
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import forge_core.config as C
          import forge_core.turbo as T
          from forge_core.dag import mining_matrix
          root = Path(".").resolve()
          rom_name = os.environ["ROM"]
          cand = [p for p in sorted((root / "configs" / "roms").glob("*.yaml"))
                  if rom_name in (p.stem, p.name)]
          assert cand, f"no rom profile for {rom_name}"
          plan = C.build_plan(root, cand[0])
          rows = [] if os.environ.get("SKIP_TURBO") == "true" \
              else T.partition_plan(plan)
          try:
              n = int(os.environ.get("CANDIDATES", "20"))
          except ValueError:
              n = 20
          mining = mining_matrix(mining=bool(n > 1), candidates=max(n, 1))
          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"{k}={v}\n")
          out("runner", plan.runner_image)
          out("target_key", plan.rom.key)
          out("turbo", json.dumps([r["partition"] for r in rows]))
          out("target", os.environ.get("INPUT_TARGET", ""))
          out("mining", json.dumps(mining))
          print(json.dumps(plan.to_dict(), indent=2))
          print("turbo rows:", [r["partition"] for r in rows])
          print("mining candidates:", mining)
          PY
      - name: "Probe state store (INDEX)"
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SYNC: ${{ github.event.inputs.force_sync }}
          ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
        run: |
          set -euo pipefail
          if [ "$FORCE_SYNC" = "true" ]; then
            echo "src_needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -m forge_core.cli --root . probe --rom "$ROM" | \
            grep '^OUT:' | sed 's/^OUT: //' | tee probe.txt || true
          if grep -q 'src_needed=false' probe.txt 2>/dev/null; then
            echo "src_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src_needed=true" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  sync:
    name: "Source sync + snapshot"
    needs: plan
    if: needs.plan.outputs.src_needed == 'true'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: "Prepare storage volume"
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "${{ github.event.inputs.rom || 'qassa-a10' }}"
      - name: "Shallow sync + bank content-addressed snapshot"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 -m forge_core.cli --root . sync --rom "${{ github.event.inputs.rom || 'qassa-a10' }}" $FORCE_FLAG

  # --------------------------------------------------------------------------
  turbo:
    name: "Turbo: ${{ matrix.partition }}"
    needs: [plan, sync]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.turbo != '[]' &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        partition: ${{ fromJSON(needs.plan.outputs.turbo) }}
    steps:
      - uses: actions/checkout@v4
      - name: "Prepare storage volume"
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "${{ github.event.inputs.rom || 'qassa-a10' }}"
      - name: "Partition prewarm (ALLOW_MISSING_DEPENDENCIES)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . slice --rom "${{ github.event.inputs.rom || 'qassa-a10' }}" --turbo-part "${{ matrix.partition }}"

  # --------------------------------------------------------------------------
  #  The in-run slot chain. slot-1 runs WHILE turbo prewarms (the system
  #  closure is the critical path; turbo only accelerates the cold start).
  #  Slots 2+ wait for their predecessor's banked state (exact resume).
  #
  #  Each slot is a MINING MATRIX: every candidate probes /proc/cpuinfo
  #  (~50 ms) and tries to atomically claim the slot's silicon lock
  #  (a GitHub Release; `gh release create` is serialized server-side).
  #  Target silicon claims instantly; non-target candidates wait out a
  #  240 s scoreboard, then the best remaining candidate claims as
  #  fallback — a slot NEVER stalls on the silicon lottery. Discarded
  #  candidates exit in ~1 min of runner time (free on public repos).
  # --------------------------------------------------------------------------
  slot-1:
    name: "Slot 1 (critical path: system) — ${{ matrix.candidate }}"
    needs: [plan, sync]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.mining) }}
    env:
      ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
      KEY: ${{ needs.plan.outputs.key }}
      SLOT: "1"
      LOCK: lock-${{ needs.plan.outputs.key }}-r${{ github.run_id }}-s1
    steps:
      - uses: actions/checkout@v4
      - name: "Silicon mining gate (probe + atomic claim)"
        id: build_gate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          sleep $((RANDOM % 5))
          python3 -m forge_core.mine gate --tag "$LOCK" --key "$KEY" \
            --min-score 100 --wait-s 240 --strict | tee mine.txt
          ROLE=$(sed -n 's/^OUT: role=//p' mine.txt | tail -1)
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          if [ "$ROLE" != "builder" ]; then
            echo "::notice::candidate ${LOCK}: role=$ROLE — fast-discard"
            exit 0
          fi
      - name: "Prepare storage volume"
        if: steps.build_gate.outputs.role == 'builder'
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        if: steps.build_gate.outputs.role == 'builder'
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
        if: steps.build_gate.outputs.role == 'builder'
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        if: steps.build_gate.outputs.role == 'builder'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "$ROM"
      - name: "Build slot 1"
        id: slot
        if: steps.build_gate.outputs.role == 'builder'
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UNTIL_BUDGET_S: "19200"
          FORGE_CKPT_MIN: "45"
          FORGE_SLOT: "1"
        run: |
          set -euo pipefail
          if [ -n "${{ needs.plan.outputs.target }}" ]; then
            export FORGE_TARGET_OVERRIDE="${{ needs.plan.outputs.target }}"
          fi
          python3 -m forge_core.cli --root . slice --rom "$ROM"
      - name: "Upload slice log artifact"
        if: always() && steps.build_gate.outputs.role == 'builder'
        uses: actions/upload-artifact@v4
        with:
          name: slice-1-log
          path: /tmp/forge-slice.log
          if-no-files-found: ignore

  slot-2:
    name: "Slot 2 — ${{ matrix.candidate }}"
    needs: [plan, slot-1]
    if: always() && needs.plan.result == 'success' && needs.slot-1.result != 'cancelled'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.mining) }}
    env:
      ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
      KEY: ${{ needs.plan.outputs.key }}
      SLOT: "2"
      LOCK: lock-${{ needs.plan.outputs.key }}-r${{ github.run_id }}-s2
    steps:
      - uses: actions/checkout@v4
      - name: "Silicon mining gate (probe + atomic claim)"
        id: build_gate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          sleep $((RANDOM % 5))
          python3 -m forge_core.mine gate --tag "$LOCK" --key "$KEY" \
            --min-score 100 --wait-s 240 --strict | tee mine.txt
          ROLE=$(sed -n 's/^OUT: role=//p' mine.txt | tail -1)
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          if [ "$ROLE" != "builder" ]; then
            echo "::notice::candidate ${LOCK}: role=$ROLE — fast-discard"
            exit 0
          fi
      - name: "Prepare storage volume"
        if: steps.build_gate.outputs.role == 'builder'
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        if: steps.build_gate.outputs.role == 'builder'
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
        if: steps.build_gate.outputs.role == 'builder'
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        if: steps.build_gate.outputs.role == 'builder'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "$ROM"
      - name: "Build slot 2"
        id: slot
        if: steps.build_gate.outputs.role == 'builder'
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UNTIL_BUDGET_S: "19200"
          FORGE_CKPT_MIN: "45"
          FORGE_SLOT: "2"
        run: |
          set -euo pipefail
          if [ -n "${{ needs.plan.outputs.target }}" ]; then
            export FORGE_TARGET_OVERRIDE="${{ needs.plan.outputs.target }}"
          fi
          python3 -m forge_core.cli --root . slice --rom "$ROM"
      - name: "Upload slice log artifact"
        if: always() && steps.build_gate.outputs.role == 'builder'
        uses: actions/upload-artifact@v4
        with:
          name: slice-2-log
          path: /tmp/forge-slice.log
          if-no-files-found: ignore

  slot-3:
    name: "Slot 3 — ${{ matrix.candidate }}"
    needs: [plan, slot-2]
    if: always() && needs.plan.result == 'success' && needs.slot-2.result != 'cancelled'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.mining) }}
    env:
      ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
      KEY: ${{ needs.plan.outputs.key }}
      SLOT: "3"
      LOCK: lock-${{ needs.plan.outputs.key }}-r${{ github.run_id }}-s3
    steps:
      - uses: actions/checkout@v4
      - name: "Silicon mining gate (probe + atomic claim)"
        id: build_gate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          sleep $((RANDOM % 5))
          python3 -m forge_core.mine gate --tag "$LOCK" --key "$KEY" \
            --min-score 100 --wait-s 240 --strict | tee mine.txt
          ROLE=$(sed -n 's/^OUT: role=//p' mine.txt | tail -1)
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          if [ "$ROLE" != "builder" ]; then
            echo "::notice::candidate ${LOCK}: role=$ROLE — fast-discard"
            exit 0
          fi
      - name: "Prepare storage volume"
        if: steps.build_gate.outputs.role == 'builder'
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        if: steps.build_gate.outputs.role == 'builder'
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
        if: steps.build_gate.outputs.role == 'builder'
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        if: steps.build_gate.outputs.role == 'builder'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "$ROM"
      - name: "Build slot 3"
        id: slot
        if: steps.build_gate.outputs.role == 'builder'
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UNTIL_BUDGET_S: "19200"
          FORGE_CKPT_MIN: "45"
          FORGE_SLOT: "3"
        run: |
          set -euo pipefail
          if [ -n "${{ needs.plan.outputs.target }}" ]; then
            export FORGE_TARGET_OVERRIDE="${{ needs.plan.outputs.target }}"
          fi
          python3 -m forge_core.cli --root . slice --rom "$ROM"
      - name: "Upload slice log artifact"
        if: always() && steps.build_gate.outputs.role == 'builder'
        uses: actions/upload-artifact@v4
        with:
          name: slice-3-log
          path: /tmp/forge-slice.log
          if-no-files-found: ignore

  slot-4:
    name: "Slot 4 — ${{ matrix.candidate }}"
    needs: [plan, slot-3]
    if: always() && needs.plan.result == 'success' && needs.slot-3.result != 'cancelled'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.mining) }}
    env:
      ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
      KEY: ${{ needs.plan.outputs.key }}
      SLOT: "4"
      LOCK: lock-${{ needs.plan.outputs.key }}-r${{ github.run_id }}-s4
    steps:
      - uses: actions/checkout@v4
      - name: "Silicon mining gate (probe + atomic claim)"
        id: build_gate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          sleep $((RANDOM % 5))
          python3 -m forge_core.mine gate --tag "$LOCK" --key "$KEY" \
            --min-score 100 --wait-s 240 --strict | tee mine.txt
          ROLE=$(sed -n 's/^OUT: role=//p' mine.txt | tail -1)
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          if [ "$ROLE" != "builder" ]; then
            echo "::notice::candidate ${LOCK}: role=$ROLE — fast-discard"
            exit 0
          fi
      - name: "Prepare storage volume"
        if: steps.build_gate.outputs.role == 'builder'
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        if: steps.build_gate.outputs.role == 'builder'
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
        if: steps.build_gate.outputs.role == 'builder'
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
        if: steps.build_gate.outputs.role == 'builder'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "$ROM"
      - name: "Build slot 4"
        id: slot
        if: steps.build_gate.outputs.role == 'builder'
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UNTIL_BUDGET_S: "19200"
          FORGE_CKPT_MIN: "45"
          FORGE_SLOT: "4"
        run: |
          set -euo pipefail
          if [ -n "${{ needs.plan.outputs.target }}" ]; then
            export FORGE_TARGET_OVERRIDE="${{ needs.plan.outputs.target }}"
          fi
          python3 -m forge_core.cli --root . slice --rom "$ROM"
      - name: "Upload slice log artifact"
        if: always() && steps.build_gate.outputs.role == 'builder'
        uses: actions/upload-artifact@v4
        with:
          name: slice-4-log
          path: /tmp/forge-slice.log
          if-no-files-found: ignore

  slot-5:
    name: "Slot 5 — ${{ matrix.candidate }}"
    needs: [plan, slot-4]
    if: always() && needs.plan.result == 'success' && needs.slot-4.result != 'cancelled'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.mining) }}
    env:
      ROM: ${{ github.event.inputs.rom || 'qassa-a10' }}
      KEY: ${{ needs.plan.outputs.key }}
      SLOT: "5"
      LOCK: lock-${{ needs.plan.outputs.key }}-r${{ github.run_id }}-s5
    steps:
      - uses: actions/checkout@v4
      - name: "Silicon mining gate (probe + atomic claim)"
        id: build_gate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          sleep $((RANDOM % 5))
          python3 -m forge_core.mine gate --tag "$LOCK" --key "$KEY" \
            --min-score 100 --wait-s 240 --strict | tee mine.txt
          ROLE=$(sed -n 's/^OUT: role=//p' mine.txt | tail -1)
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          if [ "$ROLE" != "builder" ]; then
            echo "::notice::candidate ${LOCK}: role=$ROLE — fast-discard"
            exit 0
          fi
      - name: "Prepare storage volume"
        if: steps.build_gate.outputs.role == 'builder'
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /opt /opt/romforge 2>/dev/null || true
      - uses: actions/setup-python@v5
        if: steps.build_gate.outputs.role == 'builder'
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
        if: steps.build_gate.outputs.role == 'builder'
      - name: "Prepare runner (mounts btrfs zstd:1 build volume)"
