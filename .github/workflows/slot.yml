name: "slice-slot"
# =============================================================================
#  Reusable slice slot — ONE idempotent campaign step.
#  Early-exits (~2 min) when the pipeline INDEX says the target is done;
#  refuses to run when the last slice classified CAPACITY (deadlock guard).
#  On cold starts: restores src-<mhash>, merges turbo prewarm states.
#  On continuation: restores state-<key>-s<N> (exact ninja resume).
#  Always banks its out/ back before finishing (zero redo by construction).
#
#  NOTE: forge.yml is the orchestrator of record (mining-matrix slots +
#  postcheck + conveyor). This reusable wrapper is kept for external
#  callers; it shares the same engine, so it inherits storage v2 + the
#  capacity/DAG semantics automatically.
# =============================================================================
on:
  workflow_call:
    inputs:
      rom:        { required: true, type: string }
      runner:     { required: true, type: string }
      target:     { required: false, type: string, default: "" }
      slot:       { required: true, type: string }

jobs:
  slot:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: "Prepare storage volume"
        run: |
          sudo systemctl stop docker containerd 2>/dev/null || true
          sudo rm -rf \
            /var/lib/docker \
            /var/lib/containerd \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /root/.cache 2>/dev/null || true
          sudo mkdir -p /mnt/romforge /mnt/romforge/tmp /mnt/romforge/runner_diag /opt/romforge && sudo chmod 1777 /mnt /mnt/romforge /mnt/romforge/tmp /opt /opt/romforge 2>/dev/null || true
          sudo chmod 777 /mnt/romforge/runner_diag 2>/dev/null || true
          sudo mount --bind /mnt/romforge/tmp /tmp 2>/dev/null || true
          for d in /home/runner/actions-runner/_diag /home/runner/actions-runner/cached/*/_diag; do
            if [ -e "$d" ] || [ -d "$d" ]; then
              sudo rm -rf "$d" 2>/dev/null || true
              sudo ln -sfn /mnt/romforge/runner_diag "$d" 2>/dev/null || true
            fi
          done
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet pyyaml
      - name: "Prepare runner (reclaim ~25-30 GB, swap, toolchain)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 -m forge_core.cli --root . prepare --rom "${{ inputs.rom }}"

      - name: "Build slot ${{ inputs.slot }}"
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.target }}" ]; then
            export FORGE_TARGET_OVERRIDE="${{ inputs.target }}"
          fi
          python3 -m forge_core.cli --root . slice --rom "${{ inputs.rom }}" || {
            echo "::error::Build slot failed. Forensics log tail:"
            tail -n 120 /tmp/forge-slice.log 2>/dev/null || true
            exit 1
          }

      - name: "Slot log (forensics)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slot-${{ inputs.slot }}-log
          path: "/tmp/forge-slice.log*"
          if-no-files-found: ignore
          retention-days: 3
