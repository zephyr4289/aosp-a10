name: ROMForge CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd rsync
      - name: Config schema validation
        run: python3 -m forge_core.cli --root . validate
      - name: Doctor (env self-report)
        run: python3 -m forge_core.cli --root . doctor
      - name: Python unit tests (chunker, gate, relay)
        run: bash tests/run_tests.sh
