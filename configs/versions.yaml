# =============================================================================
#  versions.yaml — the A10..A16 hosting capability matrix.
#  One entry per Android version: which runner image can host its build stack,
#  which host packages it needs, and the planning budgets ROMForge assumes.
#  Extend ONLY here when adding a new Android version (see docs/ADD_ROM.md).
# =============================================================================

"10":
  runner: ubuntu-22.04          # jammy still ships openjdk-8 + py3.10 (A10 stack)
  apt_packages:
    - git
    - git-lfs
    - ccache
    - zstd
    - curl
    - rsync
    - zip
    - unzip
    - build-essential
    - openjdk-8-jdk
    - python-is-python3
    - python3-distutils
    - zlib1g-dev
    - libncurses5-dev
    - libncursesw5-dev
  env: { LC_ALL: "C" }
  swap_gb: 4
  sync_jobs: 8
  expected_source_gb: 35
  cold_hours_4vcpu: 12          # planning number for the slice estimator
  slices_default: 4

