# =============================================================================
#  LineageOS (Android 17 / Next) for POCO F6 / Redmi Turbo 3 (peridot).
# =============================================================================
name: LineageOS
android_version: 17
device: xiaomi_peridot            # -> configs/devices/ lookup key

manifest_url: https://github.com/LineageOS/android
manifest_branch: lineage-23.2

lunch: lineage_peridot-trunk_staging-userdebug
build_target: bacon
rom_zip_glob: "lineage-*.zip"

device_clone_mode: direct         # post-sync shallow clones
device_repos:
  - path: device/xiaomi/peridot
    url: https://github.com/LineageOS/android_device_xiaomi_peridot
    branch: lineage-23.2
  - path: vendor/xiaomi/peridot
    url: https://github.com/TheMuppets/proprietary_vendor_xiaomi_peridot
    branch: lineage-23.2
  - path: hardware/xiaomi
    url: https://github.com/LineageOS/android_hardware_xiaomi
    branch: lineage-23.2

env:
  TARGET_RELEASE: "trunk_staging"
  WITH_DEXPREOPT: "false"         # massive time + disk saver
  DONT_INSTALL_DEX_DEBUG_INFO: "true"
  ALLOW_MISSING_DEPENDENCIES: "true"

slices: 8                         # A17 on Zen 5 Turin 4 vCPU: chained relay slots
slice_build_seconds: 16500

turbo:
  enabled: true
  targets: [bootimage, vendor_boot, dtboimage, vendorimage, productimage, system_extimage]
  budget_s: 16500
